# krono-job 主配置
# 敏感信息与运行环境相关项统一通过环境变量注入（.env 或 KRONO_*），
# 本文件中的值均为「非敏感默认值 / 示例值」。变量命名：KRONO_<SECTION>_<KEY>（. 换成 _），
# 详见仓库根目录 .env.example。
#
# 覆盖规则（优先级由高到低）：
#   1. 环境变量（KRONO_* 或 .env 文件）—— 若某变量有值，将覆盖下方同名默认值；
#   2. 本文件中的默认值 / 示例值 —— 仅当对应环境变量未设置时生效。
# 因此你可以直接使用示例值本地快速启动；生产环境只需在 .env 中设置真实值即可覆盖，
# 示例值不会被使用，不影响正常运行。

server:
  port: 10010                    # KRONO_SERVER_PORT

redis:
  addr: "127.0.0.1:6379"         # KRONO_REDIS_ADDR
  password: ""                   # KRONO_REDIS_PASSWORD（留空=无密码；示例为空，生产用环境变量覆盖）
  db: 15                         # KRONO_REDIS_DB

postgres:
  host: "127.0.0.1"              # KRONO_POSTGRES_HOST
  port: 5432                     # KRONO_POSTGRES_PORT
  user: "krono"                  # KRONO_POSTGRES_USER
  password: "password"           # KRONO_POSTGRES_PASSWORD（示例值；生产请用环境变量覆盖，不入库）
  dbname: "krono_job"            # KRONO_POSTGRES_DBNAME
  schema: "public"               # KRONO_POSTGRES_SCHEMA
  sslmode: "disable"             # KRONO_POSTGRES_SSLMODE
  max_conns: 10                  # KRONO_POSTGRES_MAX_CONNS

jwt:
  secret: "change-me-in-prod"    # KRONO_JWT_SECRET（示例值；生产必须用环境变量覆盖，勿提交真实密钥）
  expire_hours: 24               # KRONO_JWT_EXPIRE_HOURS

bootstrap:
  admin_user: "admin"            # KRONO_BOOTSTRAP_ADMIN_USER
  admin_pass: "123456"           # KRONO_BOOTSTRAP_ADMIN_PASS（示例值；生产请用环境变量覆盖）

jobs:
  path: "configs/jobs.yaml"      # KRONO_JOBS_PATH

# 分布式集群配置（v2：多节点调度 + 调用方探测 + 负载均衡）。
# enabled=false 时退化为单节点模式（与旧版行为一致）。
# enabled=true 时：
#   - 多个 krono-job 实例通过 Redis 选主，仅 Leader 触发调度，避免重复 dispatch；
#   - 下游被调用方【不】注册心跳；存活由调用方主动探测（TCP/HEAD）判定，
#     Worker 只在存活节点间按 lb_strategy 选目标分发（下游服务零侵入）。
cluster:
  enabled: false                                   # KRONO_CLUSTER_ENABLED（true/false）
  node_id: ""                                      # KRONO_CLUSTER_NODE_ID（留空=hostname-pid 自动生成）
  leader_key: "krono:leader"                       # KRONO_CLUSTER_LEADER_KEY
  leader_ttl: "10s"                                # KRONO_CLUSTER_LEADER_TTL（选主锁持有时间）
  health_key: "krono:node_health"                  # KRONO_CLUSTER_HEALTH_KEY（下游存活探测结果共享 Redis key）
  probe_timeout: "2s"                              # KRONO_CLUSTER_PROBE_TIMEOUT（下游存活探测超时）
  default_lb: "round_robin"                        # KRONO_CLUSTER_DEFAULT_LB（round_robin|least_conn|random|consistent）
  skip_verify_tls: false                           # KRONO_CLUSTER_SKIP_VERIFY_TLS
                                                    # true=对 HTTPS 下游跳过证书校验（内网自签/证书 IP 不匹配时直接访问）；
                                                    # false=保持默认安全校验，证书不信任将调用失败（默认）。

# cron 调度时区：所有 jobs.yaml 中 cron 表达式均按此时区解析与触发。
# 支持 IANA 时区名（如 Asia/Shanghai、America/New_York）或 "Local"（跟随运行环境）。
# 默认 Asia/Shanghai——避免依赖宿主机本地时区（如容器/termux 默认 UTC）导致
# 「日志看着像没执行」的困惑。启动时会在日志打印实际生效的 timezone，便于核对。
timezone: "Asia/Shanghai"            # KRONO_TIMEZONE

